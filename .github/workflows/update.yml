# Runs the pipeline every hour in the cloud and publishes the website,
# so nothing has to stay running on your laptop.
name: Update TickerChatter

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # adds a "Run workflow" button on GitHub
  push:                     # every branch runs the tests; only main fetches and deploys

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tickerchatter-${{ github.ref }}   # branch test runs don't wait behind the hourly job
  cancel-in-progress: false

jobs:
  # Runs first. If any test fails, nothing is fetched, committed or deployed,
  # so a broken change can't publish wrong scores.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  update:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      # The collected headlines live on their own branch, "data", which only
      # ever holds its latest version. Committing the 16 MB store to main every
      # hour grew the repo by about 0.5 MB a run and buried real commits under
      # bot commits.
      - name: Load saved data
        run: |
          mkdir -p data
          if git fetch --quiet --depth=1 origin data; then
            git show FETCH_HEAD:headlines.json > data/headlines.json
            git show FETCH_HEAD:runs.jsonl > data/runs.jsonl 2>/dev/null || rm -f data/runs.jsonl
          fi

      - name: Fetch headlines and score
        run: |
          if [ -f data/headlines.json ]; then
            python -m pipeline.run
          else
            python -m pipeline.run --backfill
          fi

      - name: Save data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init --quiet --initial-branch=data
          git config user.name "tickerchatter-bot"
          git config user.email "tickerchatter-bot@users.noreply.github.com"
          git add headlines.json runs.jsonl
          git commit --quiet -m "Saved data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
