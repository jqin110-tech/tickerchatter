# Runs the pipeline every hour in the cloud and publishes the website,
# so nothing has to stay running on your laptop.
name: Update TickerChatter

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # adds a "Run workflow" button on GitHub
  push:                     # every branch runs the tests; only main fetches and deploys

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tickerchatter-${{ github.ref }}   # branch test runs don't wait behind the hourly job
  cancel-in-progress: false

jobs:
  # Runs first. If any test fails, nothing is fetched, committed or deployed,
  # so a broken change can't publish wrong scores.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  update:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch headlines and score
        run: |
          if [ -f data/headlines.json ]; then
            python -m pipeline.run
          else
            python -m pipeline.run --backfill
          fi

      - name: Save collected headlines
        run: |
          git config user.name "tickerchatter-bot"
          git config user.email "tickerchatter-bot@users.noreply.github.com"
          git add data/headlines.json site/data site/py
          git diff --cached --quiet || git commit -m "Update headlines"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
